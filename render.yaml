# Render Blueprint — one-click deploy for RefChecker
# https://render.com/docs/blueprint-spec
#
# Deploy: click "New +" → Blueprint → connect this repo
# Or use the Deploy to Render button in the README.

services:
  - type: web
    name: refchecker
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render sets PORT automatically; the Dockerfile reads it via cli.py
    envVars:
      # Persistent data directory (matches the disk mount below)
      - key: REFCHECKER_DATA_DIR
        value: /data

      # --- Multi-user auth (required) ---
      - key: REFCHECKER_MULTIUSER
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true          # Render auto-generates a random secret
      - key: SITE_URL
        sync: false                  # User must set this to their Render URL
      - key: HTTPS_ONLY
        value: "true"

      # --- OAuth providers (configure at least one) ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false

      # --- Optional ---
      - key: REFCHECKER_ADMINS
        sync: false                  # e.g. github:markrussinovich,user@example.com
      - key: MAX_CHECKS_PER_USER
        value: "3"

      # --- GROBID (PDF reference extraction for users without LLM keys) ---
      - key: GROBID_URL
        value: http://grobid:8070

      # --- Local Semantic Scholar database (optional, improves speed) ---
      # If the file doesn't exist yet the server bootstraps it in the
      # background, then keeps it current on REFCHECKER_DB_REFRESH_INTERVAL_HOURS.
      # Until the first build finishes, checks use the (slower) remote S2 API.
      - key: REFCHECKER_DB_PATH
        value: /data/semantic_scholar.db
      - key: REFCHECKER_DB_REFRESH_INTERVAL_HOURS
        value: "24"
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false                  # Required to build/refresh the local DB

      # --- Paperclip secondary verification tier (optional) ---
      - key: PAPERCLIP_API_KEY
        sync: false                  # Set in Render dashboard
    disk:
      name: refchecker-data
      mountPath: /data
      sizeGB: 150                    # The ~90 GB slim DB plus headroom for the
                                     # incremental catch-up, which rewrites rows
                                     # in place and needs free space to land a
                                     # diff before the old pages are released.
                                     # 100 GB left only ~5 GB free and stalled
                                     # the refresh. Dataset shards are ingested
                                     # and deleted one at a time, so the shards
                                     # themselves need little room.

    healthCheckPath: /api/health

  # GROBID — PDF reference extraction engine (fallback when no LLM key)
  - type: pserv
    name: grobid
    runtime: image
    image:
      url: lfoppiano/grobid:0.8.2
    envVars:
      - key: JAVA_OPTS
        value: "-Xmx512m"
    healthCheckPath: /api/isalive
